name: Pulse deploy
# Re-runnable via push: the crm-phone-billing-config job re-syncs Stripe/Google/Resend secrets from repo secrets into Railway on every run.

# Builds the production image on GitHub (with layer caching) and has Railway
# pull it, instead of Railway rebuilding the whole monorepo on every push.

on:
  push:
    branches:
      - application-registration-ownership-guard
    paths:
      - 'packages/twenty-front/**'
      - 'packages/twenty-front-component-renderer/**'
      - 'packages/twenty-server/**'
      - 'packages/twenty-shared/**'
      - 'packages/twenty-ui/**'
      - 'packages/twenty-emails/**'
      - 'packages/twenty-sdk/**'
      - 'packages/twenty-client-sdk/**'
      - 'packages/twenty-oxlint-rules/**'
      - 'packages/twenty-docker/**'
      - '.yarn/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'tsconfig.base.json'
      - 'nx.json'
      - '.github/workflows/pulse-deploy.yaml'
      - '!**/*.md'
      - '!**/__tests__/**'
  workflow_dispatch:

concurrency:
  group: pulse-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/blacksyncai/blacksync-pulse
  RAILWAY_ENVIRONMENT_ID: 8ab88842-edce-4c68-a73d-4c91f6f5b51e
  RAILWAY_MAIN_SERVICE_ID: a5950130-0787-4c89-8f14-841138ad4da7
  RAILWAY_WORKER_SERVICE_ID: 66f02f54-1b92-4f2a-964e-b3cf7ddea1af

jobs:
  crm-phone-billing-config:
    runs-on: ubuntu-latest
    if: ${{ vars.PULSE_RAILWAY_IMAGE_DEPLOYS == 'true' }}
    steps:
      - name: Check and reuse existing CRM billing credentials
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          EXISTING_STRIPE_KEY: ${{ secrets.BILLING_STRIPE_API_KEY || secrets.STRIPE_SECRET_KEY || secrets.STRIPE_API_KEY }}
        run: |
          python3 - <<'PYCONFIG'
          import json, os, urllib.request
          def api(query, variables):
              payload=json.dumps({'query':query,'variables':variables}).encode()
              request=urllib.request.Request('https://backboard.railway.com/graphql/v2',data=payload,headers={'Content-Type':'application/json','Project-Access-Token':os.environ['RAILWAY_TOKEN'],'User-Agent':'BlackSync-Deployment/1.0'})
              with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
              if result.get('errors'): raise RuntimeError('Billing configuration query failed; no credentials were logged.')
              return result['data']
          environment=os.environ['RAILWAY_ENVIRONMENT_ID']
          services=[os.environ['RAILWAY_MAIN_SERVICE_ID'],os.environ['RAILWAY_WORKER_SERVICE_ID']]
          project=api('query($id:String!){service(id:$id){projectId}}',{'id':services[0]})['service']['projectId']
          def variables(service):
              return api('query($project:String!,$environment:String!,$service:String!){variables(projectId:$project,environmentId:$environment,serviceId:$service)}',{'project':project,'environment':environment,'service':service})['variables']
          names=('BILLING_STRIPE_API_KEY','STRIPE_SECRET_KEY','STRIPE_API_KEY')
          key=os.environ.get('EXISTING_STRIPE_KEY','')
          live=lambda value: isinstance(value,str) and value.startswith(('sk_live_','rk_live_'))
          if not live(key):
              key=next((value for service in services for name,value in variables(service).items() if name in names and live(value)), '')
          if not live(key):
              candidates=api('query($id:String!){project(id:$id){services{edges{node{id name}}}}}',{'id':project})['project']['services']['edges']
              for item in candidates:
                  service=item['node']
                  if service['id'] in services: continue
                  if not any(word in service['name'].lower() for word in ('api','backend','calling','server')): continue
                  key=next((value for name,value in variables(service['id']).items() if name in names and live(value)), '')
                  if key: break
          for service in services:
              current=variables(service)
              if live(key) and current.get('BILLING_STRIPE_API_KEY') != key:
                  api('mutation($input:VariableUpsertInput!){variableUpsert(input:$input)}',{'input':{'projectId':project,'environmentId':environment,'serviceId':service,'name':'BILLING_STRIPE_API_KEY','value':key}})
              print(json.dumps({'service':service,'crmPhoneCheckoutConfigured':live(key) or live(current.get('BILLING_STRIPE_API_KEY','')),'carrierConfigured':bool(current.get('PLIVO_AUTH_ID')) and bool(current.get('PLIVO_AUTH_TOKEN'))}))
          PYCONFIG
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select build target
        id: target
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          target=twenty
          runtime_image="${IMAGE}:latest"
          server_commit="$GITHUB_SHA"
          if [ "$EVENT_NAME" = push ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
            frontend_only=true
            while IFS= read -r changed_path; do
              case "$changed_path" in
                packages/twenty-front/*) ;;
                *) frontend_only=false ;;
              esac
            done <<< "$changed"
            if [ -n "$changed" ] && [ "$frontend_only" = true ]; then
              if release=$(curl -fsS --max-time 10 "https://crm.blacksync.cloud/release.json?commit=${BEFORE_SHA}"); then
                if server_base=$(printf '%s' "$release" | python3 -c 'import json,os,re,sys; data=json.load(sys.stdin); commit=data.get("serverCommit", ""); assert data.get("commit")==os.environ["BEFORE_SHA"] and re.fullmatch("[0-9a-f]{40}",commit); print(commit)'); then
                  if docker buildx imagetools inspect "${IMAGE}:${server_base}" >/dev/null 2>&1; then
                    target=twenty-front-only
                    runtime_image="${IMAGE}:${server_base}"
                    server_commit="$server_base"
                  fi
                fi
              fi
            fi
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$runtime_image" >> "$GITHUB_OUTPUT"
          echo "server_commit=$server_commit" >> "$GITHUB_OUTPUT"
          echo "Building target: $target"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile.railway
          push: true
          target: ${{ steps.target.outputs.target }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # The server rejects non-semver APP_VERSION values at startup.
          build-args: |
            APP_VERSION=2.45.0
            RUNTIME_IMAGE=${{ steps.target.outputs.runtime_image }}
            SOURCE_COMMIT=${{ github.sha }}
            SERVER_COMMIT=${{ steps.target.outputs.server_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build, crm-phone-billing-config]
    runs-on: ubuntu-latest
    if: ${{ vars.PULSE_RAILWAY_IMAGE_DEPLOYS == 'true' }}
    steps:
      - name: Point Railway services at the new image and redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          def railway(query):
              request=urllib.request.Request('https://backboard.railway.com/graphql/v2',data=json.dumps({'query':query}).encode(),headers={'Content-Type':'application/json','Project-Access-Token':os.environ['RAILWAY_TOKEN'],'User-Agent':'BlackSync-Deployment/1.0'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              if result.get('errors'):
                  raise RuntimeError('Railway rejected deployment; credential values were not logged.')
              return result['data']
          environment=os.environ['RAILWAY_ENVIRONMENT_ID']
          image=os.environ['IMAGE']+':'+os.environ['GITHUB_SHA']
          for service in [os.environ['RAILWAY_MAIN_SERVICE_ID'],os.environ['RAILWAY_WORKER_SERVICE_ID']]:
              railway('mutation { serviceInstanceUpdate(serviceId: "'+service+'", environmentId: "'+environment+'", input: { source: { image: "'+image+'" } }) }')
              result=railway('mutation { serviceInstanceDeployV2(serviceId: "'+service+'", environmentId: "'+environment+'") }')
              print('Railway accepted deployment: '+str(result['serviceInstanceDeployV2']))
          for attempt in range(60):
              try:
                  request=urllib.request.Request('https://crm.blacksync.cloud/release.json?commit='+os.environ['GITHUB_SHA']+'&attempt='+str(attempt),headers={'User-Agent':'BlackSync-Deployment-Check/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=10) as response:
                      release=json.load(response)
                  with urllib.request.urlopen('https://crm.blacksync.cloud/healthz',timeout=10) as response:
                      health=json.load(response)
                  if release.get('commit') == os.environ['GITHUB_SHA'] and health.get('status') == 'ok':
                      print('Verified live CRM release: '+release['commit'])
                      with urllib.request.urlopen('https://crm.blacksync.cloud/webhooks/crm-phone-numbers/status',timeout=10) as response:
                          print('CRM phone capabilities: '+json.dumps(json.load(response)))
                      break
              except Exception:
                  pass
              if attempt == 59:
                  raise RuntimeError('The new CRM release did not become healthy within the verification window.')
              time.sleep(5)
          PY

name: Google email configuration check

on:
  push:
    branches: [application-registration-ownership-guard]
    paths: [.github/workflows/google-email-setup.yaml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Google email configuration without exposing credentials
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          environment_id = '8ab88842-edce-4c68-a73d-4c91f6f5b51e'
          services = {'server': 'a5950130-0787-4c89-8f14-841138ad4da7', 'worker': '66f02f54-1b92-4f2a-964e-b3cf7ddea1af'}
          token = os.environ.get('RAILWAY_TOKEN')
          if not token:
              print('::error::The existing RAILWAY_TOKEN deployment secret is unavailable.')
              sys.exit(1)
          def railway(query, variables):
              request = urllib.request.Request('https://backboard.railway.com/graphql/v2',
                  data=json.dumps({'query': query, 'variables': variables}).encode(),
                  headers={'Content-Type': 'application/json', 'Project-Access-Token': token})
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if result.get('errors'):
                  raise RuntimeError('Railway rejected the configuration read; no values were logged.')
              return result['data']
          try:
              environment = railway('query($id: String!) { environment(id: $id) { projectId } }', {'id': environment_id})
              project_id = environment['environment']['projectId']
              for label, service_id in services.items():
                  data = railway('query($projectId: String!, $environmentId: String!, $serviceId: String!) { variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) }',
                      {'projectId': project_id, 'environmentId': environment_id, 'serviceId': service_id})['variables']
                  report = {
                      'google_client_id_present': bool(data.get('AUTH_GOOGLE_CLIENT_ID')),
                      'google_client_secret_present': bool(data.get('AUTH_GOOGLE_CLIENT_SECRET')),
                      'gmail_enabled': str(data.get('MESSAGING_PROVIDER_GMAIL_ENABLED', 'false')).lower() == 'true',
                      'google_calendar_enabled': str(data.get('CALENDAR_PROVIDER_GOOGLE_ENABLED', 'false')).lower() == 'true',
                      'google_callback_correct': data.get('AUTH_GOOGLE_APIS_CALLBACK_URL') == 'https://crm.blacksync.cloud/auth/google-apis/get-access-token',
                      'database_configuration_enabled': str(data.get('IS_CONFIG_VARIABLES_IN_DB_ENABLED', 'true')).lower() != 'false',
                  }
                  print(label + ': ' + json.dumps(report, sort_keys=True))
          except Exception as error:
              print('::error::Configuration check failed (' + type(error).__name__ + '); response bodies and credential values were not logged.')
              sys.exit(1)
          PY
